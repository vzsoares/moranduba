# Local Nostr relay for development and the relay integration tests.
services:
  relay:
    image: scsibug/nostr-rs-relay:latest
    ports:
      - "7777:8080"
    tmpfs:
      - /usr/src/app/db:mode=1777

  blossom:
    image: oven/bun:1.3
    command: ["bun", "/srv/server.ts"]
    volumes:
      - ./blossom/server.ts:/srv/server.ts:ro
    ports:
      - "8800:8800"
