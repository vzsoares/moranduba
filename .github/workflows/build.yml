# Builds the desktop apps from any branch, without publishing a release.
# Run with: gh workflow run build.yml --ref <branch>
name: Build

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.9
  GO_VERSION: "1.26"

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libnotify-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sfu/go.sum
      - name: Rust
        working-directory: app/rust
        run: rustup toolchain install
      - run: flutter build linux --release
      - run: ./tool/bundle_sfu.sh linux
      - run: >
          tar -czf "$GITHUB_WORKSPACE/moranduba-linux-x64.tar.gz"
          -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: moranduba-linux-x64.tar.gz
          retention-days: 7

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sfu/go.sum
      - name: Rust
        working-directory: app/rust
        run: rustup toolchain install
      - run: flutter build macos --release
      # Ad hoc signed: macOS asks to confirm the first launch.
      - run: ./tool/bundle_sfu.sh macos
      - run: >
          ditto -c -k --keepParent
          build/macos/Build/Products/Release/moranduba.app
          "$GITHUB_WORKSPACE/moranduba-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: moranduba-macos.zip
          retention-days: 7

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sfu/go.sum
      - name: Rust
        working-directory: app/rust
        run: rustup toolchain install
      - run: flutter build windows --release
      - run: ./tool/bundle_sfu.sh windows
      - shell: pwsh
        run: >
          Compress-Archive -Path build/windows/x64/runner/Release/*
          -DestinationPath "$env:GITHUB_WORKSPACE/moranduba-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: moranduba-windows-x64.zip
          retention-days: 7
