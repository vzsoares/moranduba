# Every push to prod builds the apps and the SFU, then publishes them as
# release v<version>, the version in app/pubspec.yaml. Bump it before
# pushing to prod: an existing release stops the run before any build.
name: Release

on:
  push:
    branches: [prod]

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.9
  GO_VERSION: "1.26"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)"
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            echo "::error::$tag is already released; bump app/pubspec.yaml"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  web:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust (from app/rust/rust-toolchain.toml)
        working-directory: app/rust
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - run: flutter pub get
      - run: ./tool/build_web_assets.sh
      - run: flutter build web --release --dart-define=MORANDUBA_GIPHY_KEY="$GIPHY_KEY"
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_API_KEY }}
      - run: cd build/web && zip -qr "$GITHUB_WORKSPACE/moranduba-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: moranduba-web.zip

  linux:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libnotify-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sfu/go.sum
      - name: Rust
        working-directory: app/rust
        run: rustup toolchain install
      - run: flutter build linux --release --dart-define=MORANDUBA_GIPHY_KEY="$GIPHY_KEY"
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_API_KEY }}
      - run: ./tool/bundle_sfu.sh linux
      - run: >
          tar -czf "$GITHUB_WORKSPACE/moranduba-linux-x64.tar.gz"
          -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: moranduba-linux-x64.tar.gz

  macos:
    needs: version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sfu/go.sum
      - name: Rust
        working-directory: app/rust
        run: rustup toolchain install
      - run: flutter build macos --release --dart-define=MORANDUBA_GIPHY_KEY="$GIPHY_KEY"
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_API_KEY }}
      # Ad hoc signed: macOS asks to confirm the first launch.
      - run: ./tool/bundle_sfu.sh macos
      - run: >
          ditto -c -k --keepParent
          build/macos/Build/Products/Release/moranduba.app
          "$GITHUB_WORKSPACE/moranduba-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: moranduba-macos.zip

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sfu/go.sum
      - name: Rust
        working-directory: app/rust
        run: rustup toolchain install
      - run: flutter build windows --release --dart-define=MORANDUBA_GIPHY_KEY="$GIPHY_KEY"
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_API_KEY }}
      - run: ./tool/bundle_sfu.sh windows
      - shell: pwsh
        run: >
          Compress-Archive -Path build/windows/x64/runner/Release/*
          -DestinationPath "$env:GITHUB_WORKSPACE/moranduba-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: moranduba-windows-x64.zip

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust
        working-directory: app/rust
        run: rustup toolchain install
      # Signed with the debug key until a release keystore exists.
      - run: flutter build apk --release --dart-define=MORANDUBA_GIPHY_KEY="$GIPHY_KEY"
        env:
          GIPHY_KEY: ${{ secrets.GIPHY_API_KEY }}
      - run: >
          cp build/app/outputs/flutter-apk/app-release.apk
          "$GITHUB_WORKSPACE/moranduba-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: moranduba-android.apk

  sfu:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sfu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sfu/go.sum
      - run: go test ./...
      - name: Cross-compile
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 \
            windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "$GITHUB_WORKSPACE/dist/moranduba-sfu-$os-$arch$ext" .
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sfu
          path: dist/*

  release:
    needs: [version, web, linux, macos, windows, android, sfu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: >
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "$TAG"
          --generate-notes
