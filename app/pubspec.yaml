name: moranduba
description: "A new Flutter project."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  cryptography: ^2.9.0
  dart_webrtc: ^1.8.2
  emoji_picker_flutter: ^4.5.4
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  flutter_webrtc:
    path: third_party/flutter_webrtc
  fvp: ^0.40.0
  hooks: ^2.0.2
  http: ^1.6.0
  native_toolchain_rust: ^1.0.4
  ndk: ^0.10.1
  path_provider: ^2.1.6
  sembast_web: ^2.4.6+1
  unifiedpush: ^6.1.0
  video_player: ^2.14.1
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/brand/logo.svg
    - assets/icons/telephone.svg

  fonts:
    - family: Bangers
      fonts:
        - asset: assets/fonts/Bangers-Regular.ttf
    - family: ComicNeue
      fonts:
        - asset: assets/fonts/ComicNeue-Regular.ttf
        - asset: assets/fonts/ComicNeue-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf

flutter_launcher_icons:
  image_path: assets/brand/icon.png
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/brand/icon_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#000000"
  macos:
    generate: true
  windows:
    generate: true
